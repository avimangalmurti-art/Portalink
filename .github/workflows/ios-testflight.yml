name: iOS TestFlight

# Signs a Release build and uploads it to App Store Connect / TestFlight.
# Runs only on demand or for ios-v* tags, never for autosave/** checkpoints.
on:
  workflow_dispatch:
  push:
    tags: ['ios-v*']

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    if: ${{ !startsWith(github.ref, 'refs/heads/autosave/') }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      # The runner context is not available in job-level env.
      - name: Set temporary paths
        run: |
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "ARCHIVE_PATH=$RUNNER_TEMP/App.xcarchive" >> "$GITHUB_ENV"
      # App Store Connect only accepts builds made with the iOS 26 SDK (Xcode 26) or later.
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::No Xcode 26+ on this runner."; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # AGENTS.md: only commits on main or heads of open PRs against main may be published.
      - name: Verify source is reviewed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          git fetch --quiet origin main
          if git merge-base --is-ancestor "$sha" origin/main; then
            echo "Source: $sha on main" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" \
            --jq ".[] | select(.state == \"open\" and .base.ref == \"main\" and .head.sha == \"$sha\") | .number" | head -n1)
          if [ -n "$pr" ]; then
            echo "Source: $sha, head of open PR #$pr against main" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::$sha is not on main or the head of an open PR against main."
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ios:sync
      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_PRIVATE_KEY" ]; then
            echo "::error::Set ASC_KEY_ID, ASC_ISSUER_ID and ASC_PRIVATE_KEY repository secrets."
            exit 1
          fi
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Set the APPLE_TEAM_ID repository variable (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          # Rebuild the PEM so pasted keys survive CRLFs, lost newlines or missing BEGIN/END lines.
          python3 - <<'PY'
          import base64, binascii, os, re, sys, textwrap
          raw = os.environ['ASC_PRIVATE_KEY']
          body = re.sub(r'-----(BEGIN|END)[A-Z ]*-----', '', raw)
          body = re.sub(r'[^A-Za-z0-9+/=]', '', body)
          try:
              der = base64.b64decode(body, validate=True)
          except binascii.Error:
              print(f'::error::ASC_PRIVATE_KEY is not base64 ({len(body)} key characters found). Paste the whole AuthKey_<KEY_ID>.p8 file.'); sys.exit(1)
          print(f'ASC_PRIVATE_KEY: BEGIN line {"present" if "BEGIN PRIVATE KEY" in raw else "missing"}, {len(der)} key bytes (a .p8 key is about 138).')
          pem = '-----BEGIN PRIVATE KEY-----\n' + '\n'.join(textwrap.wrap(base64.b64encode(der).decode(), 64)) + '\n-----END PRIVATE KEY-----\n'
          with open(os.environ['ASC_KEY_PATH'], 'w') as f: f.write(pem)
          PY
          chmod 600 "$ASC_KEY_PATH"
      # Fails fast with a readable reason when the API key, issuer or role is wrong.
      - name: Check App Store Connect API key
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess, sys, time, urllib.error, urllib.request
          b64 = lambda raw: base64.urlsafe_b64encode(raw).rstrip(b'=').decode()
          header = b64(json.dumps({'alg': 'ES256', 'kid': os.environ['ASC_KEY_ID'], 'typ': 'JWT'}).encode())
          now = int(time.time())
          claims = b64(json.dumps({'iss': os.environ['ASC_ISSUER_ID'], 'iat': now, 'exp': now + 600, 'aud': 'appstoreconnect-v1'}).encode())
          signing_input = f'{header}.{claims}'.encode()
          der = subprocess.run(['openssl', 'dgst', '-sha256', '-sign', os.environ['ASC_KEY_PATH']], input=signing_input, capture_output=True)
          if der.returncode:
              print('::error::ASC_PRIVATE_KEY is not a readable .p8 private key: ' + der.stderr.decode(errors='replace').splitlines()[0][:200]); sys.exit(1)
          # DER ECDSA signature -> raw 64-byte r||s for JWS.
          sig = der.stdout; r_len = sig[3]; r = sig[4:4 + r_len]; s_len = sig[5 + r_len]; s = sig[6 + r_len:6 + r_len + s_len]
          raw = r.lstrip(b'\0').rjust(32, b'\0') + s.lstrip(b'\0').rjust(32, b'\0')
          token = f'{header}.{claims}.{b64(raw)}'
          request = urllib.request.Request('https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.portalinknetworks.app', headers={'Authorization': f'Bearer {token}'})
          try:
              apps = json.load(urllib.request.urlopen(request))['data']
          except urllib.error.HTTPError as error:
              print(f'::error::App Store Connect rejected the API key (HTTP {error.code}). Check ASC_KEY_ID, ASC_ISSUER_ID and that ASC_PRIVATE_KEY is the full .p8 of a Team key.')
              sys.exit(1)
          print(f'API key accepted; apps with this bundle ID: {len(apps)}')
          if not apps: print('::warning::No App Store Connect app uses com.portalinknetworks.app yet.')
          PY
      # Archive unsigned: development signing needs a registered device. Export signs for
      # App Store distribution with a cloud-managed certificate, which needs no device.
      - name: Archive
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Release -destination 'generic/platform=iOS'
          -archivePath "$ARCHIVE_PATH"
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          CODE_SIGNING_ALLOWED=NO
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
          archive
      - name: Upload to TestFlight
        run: |
          cp ios/App/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          plutil -replace teamID -string "$APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
          -archivePath "$ARCHIVE_PATH" \
          -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
          -exportPath "$RUNNER_TEMP/export" \
          -allowProvisioningUpdates \
          -authenticationKeyPath "$ASC_KEY_PATH" \
          -authenticationKeyID "$ASC_KEY_ID" \
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove API key
        if: always()
        run: rm -f "$ASC_KEY_PATH"

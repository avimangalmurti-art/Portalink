name: iOS TestFlight

# Signs a Release build and uploads it to App Store Connect / TestFlight.
# Runs only on demand or for ios-v* tags, never for autosave/** checkpoints.
on:
  workflow_dispatch:
  push:
    tags: ['ios-v*']

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    if: ${{ !startsWith(github.ref, 'refs/heads/autosave/') }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
      ARCHIVE_PATH: ${{ runner.temp }}/App.xcarchive
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # AGENTS.md: only commits on main or heads of open PRs against main may be published.
      - name: Verify source is reviewed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          git fetch --quiet origin main
          if git merge-base --is-ancestor "$sha" origin/main; then
            echo "Source: $sha on main" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open --json number,headRefOid \
            --jq ".[] | select(.headRefOid == \"$sha\") | .number" | head -n1)
          if [ -n "$pr" ]; then
            echo "Source: $sha, head of open PR #$pr against main" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::$sha is not on main or the head of an open PR against main."
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ios:sync
      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_PRIVATE_KEY" ]; then
            echo "::error::Set ASC_KEY_ID, ASC_ISSUER_ID and ASC_PRIVATE_KEY repository secrets."
            exit 1
          fi
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
      - name: Archive
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Release -destination 'generic/platform=iOS'
          -archivePath "$ARCHIVE_PATH"
          -allowProvisioningUpdates
          -authenticationKeyPath "$ASC_KEY_PATH"
          -authenticationKeyID "$ASC_KEY_ID"
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
          archive
      - name: Upload to TestFlight
        run: >
          xcodebuild -exportArchive
          -archivePath "$ARCHIVE_PATH"
          -exportOptionsPlist ios/App/ExportOptions.plist
          -exportPath "$RUNNER_TEMP/export"
          -allowProvisioningUpdates
          -authenticationKeyPath "$ASC_KEY_PATH"
          -authenticationKeyID "$ASC_KEY_ID"
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove API key
        if: always()
        run: rm -f "$ASC_KEY_PATH"

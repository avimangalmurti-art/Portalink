name: Guarded release candidate
on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Reviewed main commit to build for production approval
        required: true
permissions:
  contents: read
concurrency:
  group: release-candidate-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  staging-build:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Build with environment secrets, never a credentials file
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - run: node scripts/visitor-size-gate.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: staging-candidate-${{ github.event.workflow_run.head_sha }}
          path: dist/
          retention-days: 7
      # Sites requires native connector publishing. No unsupported deploy API.
  production-build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Restrict candidate to main history
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          git checkout --detach "$RELEASE_COMMIT"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Install isolated database test runtime
        run: npm install --prefix "${{ runner.temp }}/portalink-db-tools" --no-save --package-lock=false @electric-sql/pglite@0.5.8
      - name: Guarded production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - run: node scripts/run-node-tests.mjs
        env:
          PGLITE_MODULE_PATH: ${{ runner.temp }}/portalink-db-tools/node_modules/@electric-sql/pglite/dist/index.js
      - run: node scripts/visitor-size-gate.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: production-candidate-${{ inputs.commit }}
          path: dist/
          retention-days: 7
      # Deliberately does not deploy. Resolve supported Sites headless auth first.

name: iOS

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'native/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Unsigned simulator build only: no signing, upload, TestFlight or store release.
jobs:
  simulator-build:
    if: ${{ !startsWith(github.head_ref, 'autosave/') && !startsWith(github.ref, 'refs/heads/autosave/') }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ios:sync
      - name: Build for iOS Simulator
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

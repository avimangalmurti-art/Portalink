    <script>
      (() => {
        const root = document.documentElement;
        root.toggleAttribute('data-shared-view', /^\/share(?:\/|$)/i.test(window.location.pathname));
        root.toggleAttribute('data-standalone', window.matchMedia?.('(display-mode: standalone)').matches
          || window.navigator.standalone === true);
        const presentation = window.matchMedia?.('(max-width: 639px)').matches ? 'mobile' : 'web';
        const inviteLaunch = presentation === 'mobile' && window.location.pathname === '/'
          && new URLSearchParams(window.location.search).get('welcome') === '1';
        root.toggleAttribute('data-invite-launch', inviteLaunch);
        let mode = 'auto';
        try {
          let stored = window.localStorage.getItem('portalinknetworks.deviceAppearanceMode');
          try {
            const preferences = JSON.parse(window.localStorage.getItem(`portalinknetworks.interfaceAppearance.${presentation}`) || 'null');
            if (['light', 'dark', 'auto'].includes(preferences?.mode)) stored = preferences.mode;
          } catch { /* Keep the previous setting if a saved record is invalid. */ }
          if (stored === 'light' || stored === 'dark' || stored === 'auto') mode = stored;
        } catch {
          // Storage can be unavailable in private browsing; System still works.
        }
        const systemDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
        const resolved = mode === 'auto' ? (systemDark ? 'dark' : 'light') : mode;
        root.dataset.appearance = resolved;
        root.style.colorScheme = resolved;
        if (presentation === 'mobile') {
          const color = inviteLaunch ? '#fdffff' : resolved === 'dark' ? '#000000' : '#ffffff';

          document.querySelectorAll('meta[name="theme-color"]').forEach(tag => {
            tag.setAttribute('data-portalink-theme-original', tag.getAttribute('content'));
            tag.setAttribute('content', color);
          });
        }
      })();

      (() => {
        let failed = false;
        let timer;
        const ready = () => document.documentElement.dataset.portalinkEntryReady === 'true';
        const show = () => {
          if (ready() || document.documentElement.hasAttribute('data-shared-view')) return;
          const preboot = document.getElementById('portalink-preboot');
          if (!preboot || document.getElementById('portalink-preboot-status')) return;
          const status = document.createElement('div');
          status.id = 'portalink-preboot-status';
          status.setAttribute('data-portalink-boot-status', '');
          status.setAttribute('role', 'alert');
          const copy = document.createElement('p');
          copy.textContent = 'Portalink could not finish opening. Check your connection and try again.';
          const retry = document.createElement('button');
          retry.type = 'button';
          retry.textContent = 'Try again';
          retry.onclick = () => window.location.reload();
          status.append(copy, retry);
          preboot.append(status);
        };
        const loaded = () => { if (failed) show(); };
        const error = event => {
          const target = event.target;
          if (target?.tagName !== 'SCRIPT' || target.type !== 'module') return;
          if (new URL(target.src, window.location.href).origin !== window.location.origin) return;
          failed = true;
          show();

          window.clearTimeout(timer);
          window.removeEventListener('error', error, true);
          window.removeEventListener('portalink:main-entry-ready', stop);
          document.removeEventListener('DOMContentLoaded', loaded);
          document.querySelector('[data-portalink-boot-status]')?.remove();

        window.addEventListener('error', error, true);
        window.addEventListener('portalink:main-entry-ready', stop);
        document.addEventListener('DOMContentLoaded', loaded);
        timer = window.setTimeout(() => { failed = true; show(); }, 12000);
      })();

    <script data-portalink-early-video>
      (() => {
        const video = document.getElementById('portalink-preboot-video');
        if (!video) return;
        // Keep WEB's existing reduced-motion still; MOBILE uses the requested clip.
        if (document.documentElement.hasAttribute('data-shared-view') || window.matchMedia('(min-width: 640px) and (prefers-reduced-motion: reduce)').matches) {
          video.pause(); video.removeAttribute('autoplay'); return;
        }
        let active = true, pending = false, frame;
        const paint = () => {
          frame = undefined;
          if (!active || document.hidden || video.paused || video.readyState < 2 || video.error) return;
          video.dataset.portalinkPainted = 'true';
          video.style.opacity = '1';
        };
        const playing = () => {
          pending = false;
          if (!active || frame !== undefined) return;
          if (video.requestVideoFrameCallback) frame = video.requestVideoFrameCallback(paint);
          else paint();
        };
        const play = () => {
          if (!active || document.hidden || pending || video.ended) return;
          pending = true;
          try { void video.play()?.catch(() => { pending = false; }); }
          catch { pending = false; }
        };
        const visibility = () => {
          if (document.hidden) { pending = false; video.pause(); }
          else play();
        };
        const advanced = () => {
          // A decoded frame whose playback time advanced is also ready to show
          // if WebKit has delayed its first video-frame callback.
          if (!(video.currentTime > 0) || video.dataset.portalinkPainted === 'true') return;
          if (frame !== undefined) video.cancelVideoFrameCallback?.(frame);
          frame = undefined;
          paint();
        };
        const failed = () => {
          pending = false;
          if (frame !== undefined) video.cancelVideoFrameCallback?.(frame);
          frame = undefined;
          video.style.opacity = '0';
          delete video.dataset.portalinkPainted;
        };
        const adopted = () => {
          active = false;
          if (frame !== undefined) video.cancelVideoFrameCallback?.(frame);
          video.removeEventListener('playing', playing);
          video.removeEventListener('canplay', play);
          video.removeEventListener('error', failed);
          video.removeEventListener('timeupdate', advanced);
          document.removeEventListener('visibilitychange', visibility);
          window.removeEventListener('pageshow', play);
          video.removeEventListener('portalink:splash-adopt', adopted);
        };
        video.addEventListener('playing', playing);
        video.addEventListener('canplay', play);
        video.addEventListener('error', failed);
        video.addEventListener('timeupdate', advanced);
        video.addEventListener('portalink:splash-adopt', adopted, { once: true });
        document.addEventListener('visibilitychange', visibility);
        window.addEventListener('pageshow', play);
        video.muted = true; video.defaultMuted = true; video.playsInline = true;
        if (!video.paused && video.readyState >= 2) playing();
        else play();
      })();

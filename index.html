<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/image.png" />
    <link rel="apple-touch-icon" href="/image.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <style>
      html,
      body,
      #root {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      #portalink-preboot {
        position: fixed;
        inset: 0;
        display: grid;
        min-height: 100dvh;
        place-items: center;
        overflow: hidden;
        background-color: #f3f4f6;
        background-image:
          radial-gradient(circle at 50% 42%, rgba(10, 132, 255, 0.055), transparent 31%),
          radial-gradient(1px 1px at 18% 24%, rgba(21, 21, 23, 0.08), transparent 100%),
          radial-gradient(1px 1px at 76% 31%, rgba(21, 21, 23, 0.065), transparent 100%);
        color: #151517;
      }

      html[data-appearance='dark'] #portalink-preboot {
        background-color: #0b0c0f;
        background-image:
          radial-gradient(circle at 50% 42%, rgba(10, 132, 255, 0.09), transparent 32%),
          radial-gradient(1px 1px at 18% 24%, rgba(255, 255, 255, 0.18), transparent 100%),
          radial-gradient(1px 1px at 76% 31%, rgba(255, 255, 255, 0.13), transparent 100%);
        color: #f5f5f7;
      }

      .portalink-preboot-lockup {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      #portalink-preboot svg {
        width: clamp(142px, 24vmin, 188px);
        max-width: 58vw;
        height: auto;
      }

      .portalink-preboot-wordmark {
        margin: 12px 0 0;
        font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .portalink-preboot-progress {
        display: block;
        width: 80px;
        height: 1px;
        margin-top: 16px;
        overflow: hidden;
        border-radius: 999px;
        background: color-mix(in srgb, currentColor 28%, transparent);
      }

      .portalink-preboot-progress > span {
        display: block;
        width: 100%;
        height: 100%;
        background: #0a84ff;
        transform-origin: left;
        animation: portalink-preboot-progress 1.15s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }

      @keyframes portalink-preboot-progress {
        0% { opacity: 0.28; transform: scaleX(0.08); }
        58% { opacity: 0.9; transform: scaleX(0.76); }
        100% { opacity: 0; transform: scaleX(1); }
      }

      @media (prefers-reduced-motion: reduce) {
        .portalink-preboot-progress > span {
          animation: none;
          opacity: 0.62;
          transform: scaleX(0.5);
        }
      }
    </style>
    <script>
      (() => {
        const root = document.documentElement;
        let mode = 'auto';
        try {
          const stored = window.localStorage.getItem('portalinknetworks.appearanceMode');
          if (stored === 'light' || stored === 'dark' || stored === 'auto') mode = stored;
        } catch {
          // Storage can be unavailable in private browsing; System still works.
        }
        const systemDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
        let resolved = mode === 'auto' ? (systemDark ? 'dark' : 'light') : mode;
        if (window.location.pathname.startsWith('/share/')) {
          try {
            const sharedTheme = window.localStorage.getItem('portalink.sharedAppearance');
            if (sharedTheme === 'light' || sharedTheme === 'dark') resolved = sharedTheme;
          } catch {
            // The resolved system appearance remains the public-link fallback.
          }
        }
        root.dataset.appearance = resolved;
        root.style.colorScheme = resolved;
      })();
    </script>
    <meta name="description" content="A creator platform for publishing work and discovering people, projects, and places." />
    <meta name="application-name" content="portalinknetworks" />
    <meta name="apple-mobile-web-app-title" content="portalinknetworks" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="portalinknetworks" />
    <meta property="og:description" content="Publish work. Discover people, projects, and places." />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="portalinknetworks" />
    <meta name="twitter:description" content="Publish work. Discover people, projects, and places." />
    <meta name="twitter:image" content="/og.png" />
    <title>portalinknetworks is a product of Portalink Technologies Inc.</title>
  </head>
  <body>

        <svg aria-hidden="true" focusable="false" viewBox="0 0 420 600">

            <clipPath id="portalink-preboot-torso-clip">

            </clipPath>
          </defs>

          <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M214 247 C245 250 273 229 291 197"></path>
            <path d="M232 285 C271 275 302 248 318 220"></path>
            <path d="M291 197 C284 178 282 158 288 149 C294 141 303 149 311 165 L316 178 L315 123 C315 109 320 99 328 99 C337 99 339 109 336 123 L329 159 L340 118 C343 105 351 99 358 103 C366 107 363 119 359 131 L348 163 L357 137 C361 125 368 122 374 127 C380 132 376 144 371 155 L359 177 L366 160 C371 149 378 149 382 155 C386 161 379 172 374 181 L359 207 C350 224 333 230 317 221 C305 215 298 206 291 197 Z"></path>
            <path d="M318 220 C328 226 343 226 359 207"></path>

            <path d="M117 239 C85 250 66 301 62 362 L58 420 C56 447 66 464 82 464 C96 464 103 449 98 431 C105 420 103 407 97 399 L102 353 C106 307 114 274 129 252"></path>
            <path d="M62 368 C74 373 86 374 99 370"></path>

            <g clip-path="url(#portalink-preboot-torso-clip)">
              <path d="M164 228 L164 529"></path>
              <path d="M127 230 C105 300 106 457 139 523"></path>
              <path d="M201 230 C223 300 222 457 189 523"></path>
              <path d="M82 278 C118 305 208 305 246 278"></path>
              <path d="M75 346 C116 375 212 375 253 346"></path>
              <path d="M82 416 C122 447 206 447 246 416"></path>
              <path d="M102 486 C135 502 193 502 226 486"></path>
            </g>
            <path d="M124 232 C95 244 78 287 75 344 C70 434 96 517 164 526 C232 517 258 434 253 344 C250 287 233 244 204 232 C185 243 143 243 124 232 Z"></path>

            <g clip-path="url(#portalink-preboot-head-clip)">
              <path d="M164 50 L164 246"></path>
              <path d="M145 52 C109 91 107 203 145 244"></path>
              <path d="M183 52 C219 91 221 203 183 244"></path>
              <path d="M78 108 C121 88 207 88 250 108"></path>
              <path d="M68 148 C113 158 215 158 260 148"></path>
              <path d="M79 193 C123 213 205 213 249 193"></path>
            </g>
            <circle cx="164" cy="148" r="96"></circle>
          </g>
        </svg>
        <p class="portalink-preboot-wordmark">Portalink Networks</p>
        <span class="portalink-preboot-progress" aria-hidden="true"><span></span></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/image.png" />
    <link rel="apple-touch-icon" href="/image.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <style>
      html,
      body,
      #root {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      #portalink-preboot {
        position: fixed;
        inset: 0;
        display: grid;
        min-height: 100dvh;
        place-items: center;
        overflow: hidden;
        background: #fff;
        color: #000;
      }

      #portalink-preboot svg {
        width: clamp(220px, 42vmin, 320px);
        max-width: 82vw;
        max-height: 78dvh;
      }
    </style>
    <script>
      (() => {
        const root = document.documentElement;
        let mode = 'auto';
        try {
          const stored = window.localStorage.getItem('portalinknetworks.appearanceMode');
          if (stored === 'light' || stored === 'dark' || stored === 'auto') mode = stored;
        } catch {
          // Storage can be unavailable in private browsing; System still works.
        }
        const systemDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
        const resolved = mode === 'auto' ? (systemDark ? 'dark' : 'light') : mode;
        root.dataset.appearance = resolved;
        root.style.colorScheme = resolved;
      })();
    </script>
    <meta name="description" content="A creator platform for publishing work and discovering people, projects, and places." />
    <meta name="application-name" content="portalinknetworks" />
    <meta name="apple-mobile-web-app-title" content="portalinknetworks" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="portalinknetworks" />
    <meta property="og:description" content="Publish work. Discover people, projects, and places." />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="portalinknetworks" />
    <meta name="twitter:description" content="Publish work. Discover people, projects, and places." />
    <meta name="twitter:image" content="/og.png" />
    <title>portalinknetworks is a product of Portalink Technologies Inc.</title>
  </head>
  <body>
    <div id="root">
      <!-- First paint: React replaces this exact mitten frame with the animated
           layered loader. Keeping it inline prevents a blank network/JS gap. -->
      <div id="portalink-preboot" role="status" aria-label="Portalink is loading">
        <svg aria-hidden="true" focusable="false" viewBox="0 0 420 600">
          <defs>

            </clipPath>

              <path d="M82 416 C122 447 206 447 246 416"></path>

            </g>
            <path d="M124 232 C95 244 78 287 75 344 C70 434 96 517 164 526 C232 517 258 434 253 344 C250 287 233 244 204 232 C185 243 143 243 124 232 Z"></path>

            <g clip-path="url(#portalink-preboot-head-clip)">
              <path d="M164 50 L164 246"></path>
              <path d="M145 52 C109 91 107 203 145 244"></path>

</html>

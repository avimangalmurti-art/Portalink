    <style>
      html,
      body,
      #root {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      #portalink-preboot {
        --portalink-splash-background: #f5eaf4;
        --portalink-media-ratio: 1;
        position: fixed;
        inset: 0;
        display: grid;
        min-height: 100dvh;
        place-items: center;
        overflow: hidden;
        background-color: #f5eaf4;
        background-image: none;
        color: #000000;
      }

      #portalink-preboot .portalink-preboot-media {
        display: grid;
        place-items: center;
        container-type: size;
        width: min(100vw, 100dvh, 576px);
        max-height: 100dvh;
        height: min(100vw, 100dvh, 576px);
        pointer-events: none;
      }
      #portalink-preboot picture {
        display: block;
        position: relative;
        width: min(100cqw, calc(100cqh * var(--portalink-media-ratio)));
        aspect-ratio: var(--portalink-media-ratio);
        overflow: hidden;
        background: var(--portalink-splash-background);
        color-scheme: light;
      }
      #portalink-preboot img {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        outline: 0;
        box-shadow: none;
        background: var(--portalink-splash-background);
        object-fit: fill;
      }
      #portalink-preboot picture::after {
        content: '';
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 3px 4px var(--portalink-splash-background);
      }

      /* The same looping clip is visible before JavaScript on mobile. */
      @media (max-width: 639px) {
        :root { --mobile-launch-height: 100vh; }
        html[data-appearance='light'] { background-color: #ffffff; }
        html[data-appearance='dark'] { background-color: #000000; }
        body { background-color: inherit; }
        html:root, html:root body, html:root #root {
          margin: 0;
          height: auto;
          min-height: 100vh;
          min-height: 100dvh;
          box-sizing: border-box;
          overscroll-behavior: auto;
        }
        /* Match the visible launch layer even while the app mounts beneath it. */
        html:root:has(#portalink-preboot, [data-portalink-splash][data-presentation='mobile']:not([aria-hidden='true']), [data-presentation='mobile'].portalink-startup-wait),
        html:root:has(#portalink-preboot, [data-portalink-splash][data-presentation='mobile']:not([aria-hidden='true']), [data-presentation='mobile'].portalink-startup-wait) body {
          background-color: #f8fdfc !important;
        }
        /* Legacy iOS navigator.standalone is marked before the body is parsed. */
        html:root[data-standalone], html:root[data-standalone] body, html:root[data-standalone] #root {
          height: auto;
          min-height: 100vh;
          overflow: visible;
        }
        html:root[data-standalone] {
          --mobile-launch-height: 100vh;
          --mobile-viewport-height: 100vh;
          --mobile-fixed-offset: 0px;
        }
        #portalink-preboot { background-color: #f8fdfc; --portalink-splash-background: #f8fdfc; --portalink-media-ratio: 0.7111111111; }
        #portalink-preboot { height: var(--mobile-launch-height); min-height: var(--mobile-launch-height); }
        #portalink-preboot .portalink-preboot-media {
          width: 100vw;
          height: var(--mobile-launch-height);
          max-height: var(--mobile-launch-height);
        }
      }

      @supports (height: 100dvh) {
        @media (max-width: 639px) {
          :root:not([data-standalone]) { --mobile-launch-height: 100dvh; }
        }
      }
      @media (max-width: 639px) and (display-mode: standalone) {
        html:root, html:root body, html:root #root {
          height: auto;
          min-height: 100vh;
          overflow: visible;
        }
        :root {
          --mobile-launch-height: 100vh;
          --mobile-viewport-height: 100vh;
          --mobile-fixed-offset: 0px;
        }
      }

      /* Shared links use a neutral first paint, including before React loads. */
      html:root[data-shared-view]:has(#portalink-preboot), html:root[data-shared-view]:has(#portalink-preboot) body,
      html:root[data-shared-view] #portalink-preboot { background-color: #fff !important; color: #1c1c1e; }
      html:root[data-shared-view][data-appearance='dark']:has(#portalink-preboot), html:root[data-shared-view][data-appearance='dark']:has(#portalink-preboot) body,
      html:root[data-shared-view][data-appearance='dark'] #portalink-preboot { background-color: #000 !important; color: #f5f5f7; }
      html[data-shared-view] #portalink-preboot .portalink-preboot-media,
      html[data-shared-view] #portalink-preboot picture { display: none; }
      html[data-shared-view] #portalink-preboot::after { content: 'Opening shared content…'; font: 14px system-ui, sans-serif; }

    <script>
      (() => {
        const root = document.documentElement;
        root.toggleAttribute('data-shared-view', /^\/share(?:\/|$)/i.test(window.location.pathname));
        root.toggleAttribute('data-standalone', window.matchMedia?.('(display-mode: standalone)').matches
          || window.navigator.standalone === true);
        const presentation = window.matchMedia?.('(max-width: 639px)').matches ? 'mobile' : 'web';
        let mode = 'auto';
        try {
          let stored = window.localStorage.getItem('portalinknetworks.deviceAppearanceMode');
          try {
            const preferences = JSON.parse(window.localStorage.getItem(`portalinknetworks.interfaceAppearance.${presentation}`) || 'null');
            if (['light', 'dark', 'auto'].includes(preferences?.mode)) stored = preferences.mode;
          } catch { /* Keep the previous setting if a saved record is invalid. */ }
          if (stored === 'light' || stored === 'dark' || stored === 'auto') mode = stored;
        } catch {
          // Storage can be unavailable in private browsing; System still works.
        }
        const systemDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
        const resolved = mode === 'auto' ? (systemDark ? 'dark' : 'light') : mode;
        root.dataset.appearance = resolved;
        root.style.colorScheme = resolved;
        if (presentation === 'mobile') {
          const color = resolved === 'dark' ? '#000000' : '#ffffff';

          document.querySelectorAll('meta[name="theme-color"]').forEach(tag => {
            tag.setAttribute('data-portalink-theme-original', tag.getAttribute('content'));
            tag.setAttribute('content', color);
          });
        }
      })();
    </script>

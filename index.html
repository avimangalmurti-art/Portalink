<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/image.png" />
    <link rel="apple-touch-icon" href="/image.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <style>
      html,
      body,
      #root {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      #portalink-preboot {
        position: fixed;
        inset: 0;
        display: grid;
        min-height: 100dvh;
        place-items: center;
        overflow: hidden;
        background-color: #f3f4f6;
        background-image:
          radial-gradient(circle at 50% 42%, rgba(10, 132, 255, 0.055), transparent 31%),
          radial-gradient(1px 1px at 18% 24%, rgba(21, 21, 23, 0.08), transparent 100%),
          radial-gradient(1px 1px at 76% 31%, rgba(21, 21, 23, 0.065), transparent 100%);
        color: #151517;
      }

      html[data-appearance='dark'] #portalink-preboot {
        background-color: #0b0c0f;
        background-image:
          radial-gradient(circle at 50% 42%, rgba(10, 132, 255, 0.09), transparent 32%),
          radial-gradient(1px 1px at 18% 24%, rgba(255, 255, 255, 0.18), transparent 100%),
          radial-gradient(1px 1px at 76% 31%, rgba(255, 255, 255, 0.13), transparent 100%);
        color: #f5f5f7;
      }

      .portalink-preboot-lockup {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      #portalink-preboot img {
        width: clamp(108px, 18vmin, 148px);
        max-width: 48vw;
        height: auto;
      }

      html[data-appearance='dark'] #portalink-preboot img {
        filter: invert(1);
      }

      .portalink-preboot-wordmark {
        margin: 12px 0 0;
        font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

    </style>
    <script>
      (() => {
        const root = document.documentElement;
        let mode = 'auto';
        try {
          const stored = window.localStorage.getItem('portalinknetworks.appearanceMode');
          if (stored === 'light' || stored === 'dark' || stored === 'auto') mode = stored;
        } catch {
          // Storage can be unavailable in private browsing; System still works.
        }
        const systemDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
        let resolved = mode === 'auto' ? (systemDark ? 'dark' : 'light') : mode;
        if (window.location.pathname.startsWith('/share/')) {
          try {
            const sharedTheme = window.localStorage.getItem('portalink.sharedAppearance');
            if (sharedTheme === 'light' || sharedTheme === 'dark') resolved = sharedTheme;
          } catch {
            // The resolved system appearance remains the public-link fallback.
          }
        }
        root.dataset.appearance = resolved;
        root.style.colorScheme = resolved;
      })();
    </script>
    <meta name="description" content="A creator platform for publishing work and discovering people, projects, and places." />
    <meta name="application-name" content="portalinknetworks" />
    <meta name="apple-mobile-web-app-title" content="portalinknetworks" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="portalinknetworks" />
    <meta property="og:description" content="Publish work. Discover people, projects, and places." />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="portalinknetworks" />
    <meta name="twitter:description" content="Publish work. Discover people, projects, and places." />
    <meta name="twitter:image" content="/og.png" />
    <title>portalinknetworks is a product of Portalink Technologies Inc.</title>
  </head>
  <body>
    <div id="root">
      <!-- First paint matches React's theme-aware lockup, preventing a blank or
           opposite-theme frame while the application bundle starts. -->
      <div id="portalink-preboot" role="status" aria-label="Portalink is loading">
        <div class="portalink-preboot-lockup">
        <img src="/portalink-splash-character.png" alt="" aria-hidden="true" width="222" height="372" />
        <p class="portalink-preboot-wordmark">Portalink Networks</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>

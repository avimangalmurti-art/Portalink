<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Optional font delivery must not hold the application stylesheet/paint. -->
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Noto+Sans:wght@400;500;600;700&amp;family=Noto+Sans+JP:wght@400;500;600;700&amp;family=Noto+Sans+Devanagari:wght@400;500;600;700&amp;family=Noto+Sans+Siddham&amp;display=swap" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Noto+Sans:wght@400;500;600;700&amp;family=Noto+Sans+JP:wght@400;500;600;700&amp;family=Noto+Sans+Devanagari:wght@400;500;600;700&amp;family=Noto+Sans+Siddham&amp;display=swap" /></noscript>
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico?v=f74efbdf" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/portalink-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/portalink-favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <link rel="manifest" href="/site.webmanifest?v=f74efbdf" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html,
      body,
      #root {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      #portalink-preboot {
        position: fixed;
        inset: 0;
        display: grid;
        min-height: 100dvh;
        place-items: center;
        overflow: hidden;
        background-color: #f5eaf4;
        background-image: none;
        color: #000000;
      }

      #portalink-preboot img {
        display: block;
        width: min(100vw, 100dvh, 576px);
        max-height: 100dvh;
        height: auto;
        object-fit: contain;
      }

      #portalink-preboot picture { display: contents; }
      #portalink-preboot .mobile-startup-status { display: none; }

      /* No obsolete full-screen still before the mobile welcome mounts. */
      @media (max-width: 639px) {
        #portalink-preboot { background-color: #f8fdfc; }
        #portalink-preboot picture { display: none; }
        #portalink-preboot .mobile-startup-status {
          display: block;
          font: 16px/1.5 system-ui, sans-serif;
          color: #6f7682;
        }
      }

    </style>
    <script>
      (() => {
        const root = document.documentElement;
        const presentation = window.matchMedia?.('(max-width: 639px)').matches ? 'mobile' : 'web';
        let mode = 'auto';
        try {
          let stored = window.localStorage.getItem('portalinknetworks.deviceAppearanceMode');
          try {
            const preferences = JSON.parse(window.localStorage.getItem(`portalinknetworks.interfaceAppearance.${presentation}`) || 'null');
            if (['light', 'dark', 'auto'].includes(preferences?.mode)) stored = preferences.mode;
          } catch { /* Keep the previous setting if a saved record is invalid. */ }
          if (stored === 'light' || stored === 'dark' || stored === 'auto') mode = stored;
        } catch {
          // Storage can be unavailable in private browsing; System still works.
        }
        const systemDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
        let resolved = mode === 'auto' ? (systemDark ? 'dark' : 'light') : mode;
        if (window.location.pathname.startsWith('/share/')) {
          resolved = systemDark ? 'dark' : 'light';
          try {
            const profileId = window.location.pathname.split('/')[2];
            const sharedTheme = window.localStorage.getItem(`portalink.publicTheme.${profileId}.${presentation}`)
              ?? window.localStorage.getItem(`portalink.publicTheme.${profileId}`);
            if (sharedTheme === 'light' || sharedTheme === 'dark') resolved = sharedTheme;
          } catch {
            // The resolved system appearance remains the public-link fallback.
          }
        }
        root.dataset.appearance = resolved;
        root.style.colorScheme = resolved;
      })();
    </script>
    <meta name="description" content="A creator platform for publishing work and discovering people, projects, and places." />
    <meta name="application-name" content="portalinknetworks" />
    <meta name="apple-mobile-web-app-title" content="portalinknetworks" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="portalinknetworks" />
    <meta property="og:description" content="Publish work. Discover people, projects, and places." />
    <meta property="og:image" content="https://portalinknetworksinc.avimangalmurti566055.chatgpt.site/og.png?v=fdd1d9eb" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="741" />
    <meta property="og:image:height" content="981" />
    <meta property="og:image:alt" content="Hello World — the Portalink character holding the Earth." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="portalinknetworks" />
    <meta name="twitter:description" content="Publish work. Discover people, projects, and places." />
    <meta name="twitter:image" content="https://portalinknetworksinc.avimangalmurti566055.chatgpt.site/og.png?v=fdd1d9eb" />
    <meta name="twitter:image:alt" content="Hello World — the Portalink character holding the Earth." />
    <title>portalink networks</title>
  </head>
  <body>
    <div id="root">
      <!-- WEB retains its first frame; MOBILE goes straight to its welcome. -->
      <div id="portalink-preboot" role="status" aria-label="Portalink is loading">
        <picture>
          <!-- Inline blank avoids downloading the hidden WEB poster on phones. -->
          <source media="(max-width: 639px)" srcset="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" />
          <img src="/portalink-splash-poster.png" alt="" aria-hidden="true" width="576" height="576" />
        </picture>
        <span class="mobile-startup-status" aria-hidden="true">Opening Portalink…</span>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>

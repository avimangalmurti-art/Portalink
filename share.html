      (() => {
        const url = new URL(window.location.href);
        if (url.hostname !== 'portalinknetworksinc.avimangalmurti566055.chatgpt.site') return;
        // Complete existing origin-bound email/OAuth callbacks where they began.
        // The server cannot see fragment tokens, so root navigation is checked here.
        const callbackKeys = /^(?:code|state|nonce|auth|entry|onboarding_return|access_token|refresh_token|id_token|session|session_id|token|token_hash|type|error|error_code|error_description|provider_token|provider_refresh_token|expires_at|expires_in|token_type)$/i;
        if ([...url.searchParams.keys(), ...new URLSearchParams(url.hash.slice(1)).keys()].some(key => callbackKeys.test(key))) return;
        url.protocol = 'https:';
        url.host = 'portalinknetworks.com';
        url.username = '';
        url.password = '';
        window.location.replace(url.href);
      })();
    </script>

    <script>
      (() => {
        const resolved = window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        const root = document.documentElement;
        root.dataset.appearance = resolved;
        root.style.colorScheme = resolved;
        const color = resolved === 'dark' ? '#000000' : '#ffffff';
        document.querySelectorAll('meta[name="theme-color"]').forEach(tag => {
          tag.setAttribute('data-portalink-theme-original', tag.getAttribute('content'));
          tag.setAttribute('content', color);
        });
      })();

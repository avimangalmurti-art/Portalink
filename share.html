    <style>html,body,#root{margin:0;width:100%;min-height:100%}body{background:inherit}html{background:#fff;color:#1c1c1e}@media(prefers-color-scheme:dark){html{background:#000;color:#f5f5f7}}@media(max-width:639px){html[data-appearance='light']{background:#fff}html[data-appearance='dark']{background:#000}}</style>
    <script>
      (() => {
        const resolved = window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        const root = document.documentElement;
        root.dataset.appearance = resolved;
        root.style.colorScheme = resolved;
        const color = resolved === 'dark' ? '#000000' : '#ffffff';
        document.querySelectorAll('meta[name="theme-color"]').forEach(tag => {
          tag.setAttribute('data-portalink-theme-original', tag.getAttribute('content'));
          tag.setAttribute('content', color);
        });
      })();
    </script>

    <script data-portalink-canonical-entry>
      (() => {
        const url = new URL(window.location.href);
        if (url.hostname !== 'portalinknetworksinc.avimangalmurti566055.chatgpt.site') return;
        // Complete existing origin-bound email/OAuth callbacks where they began.
        // The server cannot see fragment tokens, so root navigation is checked here.
        const callbackKeys = /^(?:code|state|nonce|auth|entry|onboarding_return|access_token|refresh_token|id_token|session|session_id|token|token_hash|type|error|error_code|error_description|provider_token|provider_refresh_token|expires_at|expires_in|token_type)$/i;
        if ([...url.searchParams.keys(), ...new URLSearchParams(url.hash.slice(1)).keys()].some(key => callbackKeys.test(key))) return;
        url.protocol = 'https:';
        url.host = 'portalinknetworks.com';
        url.username = '';
        url.password = '';
        window.location.replace(url.href);
      })();
    </script>

      @media (prefers-color-scheme: dark) {
        html:not([data-appearance]) { --shared-catalogue-canvas: #000; color: #f5f5f7; }
      }
      html[data-appearance='dark'] { --shared-catalogue-canvas: #000; color: #f5f5f7; }
      @media (max-width: 639px) {
        /* Keep the scroll boundary on the catalogue's canvas in embedded browsers. */
        html[data-shared-view] { overscroll-behavior-y: none; }
      }
      html[data-shared-view][data-mobile-project-launch] {
        --shared-catalogue-canvas: #000;
        background-color: var(--shared-catalogue-canvas);
        color: #fff;

      html[data-mobile-project-launch] #portalink-mobile-launch {
        position: fixed;
        inset: 0;
        z-index: 1002;
        display: grid;
        place-items: center;
        background: #000;
      }
      html[data-mobile-project-launch] #portalink-mobile-launch > span {
        width: 18px;
        height: 18px;
        background: url('/loading-spokes.svg') center / contain no-repeat;
        animation: portalink-opening-project 600ms steps(8) infinite;
      }
      @keyframes portalink-opening-project { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        html[data-mobile-project-launch] #portalink-mobile-launch > span { animation: none; }
      }

    <script>
      (() => {
        const presentation = window.matchMedia?.('(max-width: 639px)').matches ? 'mobile' : 'web';
        const projectLaunch = presentation === 'mobile'
          && /^\/(?:share\/[^/]+|[^/]+)\/c\/[^/]+\/[^/]+\/?$/i.test(window.location.pathname);
        let mode = 'auto';
        try {
          const legacyMode = window.localStorage.getItem('portalinknetworks.deviceAppearanceMode');
          if (['light', 'dark', 'auto'].includes(legacyMode)) mode = legacyMode;
          try {
            const preferences = JSON.parse(window.localStorage.getItem(`portalinknetworks.interfaceAppearance.${presentation}`) || 'null');
            if (['light', 'dark', 'auto'].includes(preferences?.mode)) mode = preferences.mode;
          } catch { /* An invalid saved record falls back to the device setting. */ }
        } catch { /* Private browsing can restrict storage access. */ }
        const systemDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
        const resolved = mode === 'auto' ? (systemDark ? 'dark' : 'light') : mode;
        const root = document.documentElement;
        if (projectLaunch) root.setAttribute('data-mobile-project-launch', '');
        root.dataset.appearance = resolved;
        root.style.colorScheme = resolved;
        const color = resolved === 'dark' ? '#000000' : '#ffffff';
        document.querySelectorAll('meta[name="theme-color"]').forEach(tag => {
          tag.setAttribute('data-portalink-theme-original', tag.getAttribute('content'));
          tag.setAttribute('content', projectLaunch ? '#000000' : color);
        });
      })();
    </script>
